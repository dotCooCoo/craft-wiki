backend:
  name: github
  repo: storytold/craft-wiki
  branch: main
  api_root: https://craft.wiki/api/github
  base_url: https://craft.wiki
  auth_endpoint: api/auth
  auth_methods: [oauth, token]
  auth_scope: public_repo
  open_authoring: true
publish_mode: editorial_workflow
output:
  omit_empty_optional_fields: true
media_folder: public/assets/uploads
public_folder: /assets/uploads
collections:
  - name: artcraft-studio
    label: ArtCraft Studio
    folder: src/content/docs/apps/artcraft-studio
    publish_mode: simple
    create: true
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string, required: false }
      - { label: Sidebar section, name: parent, widget: select, options: [{ label: Workflows, value: workflows }], required: false, hint: "Choose Workflows to list this page under Workflows in the sidebar. Leave it empty to list the page at the top level." }
      - { label: Sidebar, name: sidebar, widget: object, required: false, fields: [{ label: Order, name: order, widget: number, value_type: float, required: false, hint: "The sidebar and the previous and next links sort pages by this number. Pick a number between those of the pages before and after this one. A page without a number is listed after the numbered pages." }] }
      - { label: Body, name: body, widget: markdown }
